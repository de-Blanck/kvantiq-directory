name: CI

on:
  push:
    branches: [main, feature/directory-site]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check for duplicate slugs
        run: |
          for dir in companies resources use-cases benchmarks challenges; do
            echo "=== $dir ==="
            dupes=$(cat src/content/$dir/*.json | grep '"slug"' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "DUPLICATE SLUGS FOUND in $dir: $dupes"
              exit 1
            fi
          done
          echo "No duplicate slugs found."

      - name: Validate minimum 2 sources per entry
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dirs = ['companies', 'benchmarks', 'use-cases', 'challenges', 'resources'];
          let failed = false;
          for (const dir of dirs) {
            const base = path.join('src/content', dir);
            for (const file of fs.readdirSync(base)) {
              if (!file.endsWith('.json')) continue;
              const data = JSON.parse(fs.readFileSync(path.join(base, file), 'utf8'));
              if (!data.sources || data.sources.length < 2) {
                console.error('FAIL: ' + dir + '/' + file + ' has ' + (data.sources ? data.sources.length : 0) + ' sources (minimum 2)');
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          console.log('All entries have >= 2 sources.');
          "

      - name: Validate source URLs are not empty
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dirs = ['companies', 'benchmarks', 'use-cases', 'challenges', 'resources'];
          let failed = false;
          for (const dir of dirs) {
            const base = path.join('src/content', dir);
            for (const file of fs.readdirSync(base)) {
              if (!file.endsWith('.json')) continue;
              const data = JSON.parse(fs.readFileSync(path.join(base, file), 'utf8'));
              for (const [i, src] of (data.sources || []).entries()) {
                if (!src.url || !src.url.startsWith('http')) {
                  console.error('FAIL: ' + dir + '/' + file + ' source[' + i + '] has invalid URL: ' + src.url);
                  failed = true;
                }
              }
            }
          }
          if (failed) process.exit(1);
          console.log('All source URLs are valid.');
          "

      - name: Data quality audit
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dirs = ['companies', 'benchmarks', 'use-cases', 'challenges', 'resources'];
          let failed = false;
          function fail(entry, msg) { console.error('FAIL: ' + entry + ' — ' + msg); failed = true; }

          for (const dir of dirs) {
            const base = path.join('src/content', dir);
            for (const file of fs.readdirSync(base)) {
              if (!file.endsWith('.json')) continue;
              const entry = dir + '/' + file;
              const data = JSON.parse(fs.readFileSync(path.join(base, file), 'utf8'));

              // Slug must match filename
              if (data.slug !== file.replace('.json', '')) fail(entry, 'slug (' + data.slug + ') does not match filename');

              // No empty strings in any field
              for (const [key, val] of Object.entries(data)) {
                if (typeof val === 'string' && val.trim() === '') fail(entry, 'empty string in field: ' + key);
              }

              // Description minimum length
              if (!data.description || data.description.length < 20) fail(entry, 'description too short (' + (data.description || '').length + ' chars, min 20)');

              // Tags must exist and be non-empty
              if (!data.tags || data.tags.length === 0) fail(entry, 'no tags');
              if (data.tags) data.tags.forEach((t, i) => { if (!t || t.trim() === '') fail(entry, 'empty tag at index ' + i); });

              // Sources must have URLs
              if (data.sources) data.sources.forEach((s, i) => {
                if (!s.url || !s.url.startsWith('http')) fail(entry, 'source[' + i + '] invalid URL');
              });

              // Use-case specific: problem and approach must be substantial
              if (dir === 'use-cases') {
                if (!data.problem || data.problem.length < 20) fail(entry, 'problem too short');
                if (!data.approach || data.approach.length < 20) fail(entry, 'approach too short');
              }
            }
          }
          if (failed) process.exit(1);
          console.log('Data quality audit passed.');
          "

      - name: Check blocklist compliance
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const blocklist = ['amazon.com', 'aws.amazon.com', 'cloud.google.com', 'meta.com', 'facebook.com'];
          const base = 'src/content/companies';
          let failed = false;
          for (const file of fs.readdirSync(base)) {
            if (!file.endsWith('.json')) continue;
            const data = JSON.parse(fs.readFileSync(path.join(base, file), 'utf8'));
            for (const domain of blocklist) {
              if (data.website && data.website.includes(domain)) {
                console.error('FAIL: companies/' + file + ' links to blocklisted domain: ' + domain);
                failed = true;
              }
            }
          }
          if (failed) process.exit(1);
          console.log('No blocklisted company links found.');
          "

      - name: Summary
        if: always()
        run: |
          echo "=== Content Summary ==="
          for dir in companies resources use-cases benchmarks challenges; do
            count=$(ls src/content/$dir/*.json 2>/dev/null | wc -l)
            echo "$dir: $count entries"
          done
