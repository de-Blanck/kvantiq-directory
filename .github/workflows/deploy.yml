name: Deploy to Vercel

# Triggers a production deploy of directory.kvantiq.studio whenever main moves.
# Replaces Vercel's GitHub auto-deploy (currently disabled at the project level)
# so PRs don't accumulate undeployed in main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One production deploy at a time. Don't cancel in-flight: a pending deploy
# represents real user-visible state we don't want to abandon.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Vercel (production)
        # Drop the --token flag and rely on the VERCEL_TOKEN env var: the flag
        # value is validated by Vercel's CLI for shell-unsafe characters and
        # any whitespace from how the secret was pasted causes a hard reject
        # ("Must not contain: ' ', '-', '/'"). The env-var path skips that
        # validator and just authenticates.
        run: npx --yes vercel@latest deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
