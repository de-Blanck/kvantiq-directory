name: Kvantiq Agent

# Runs every 5 calendar days. GitHub Actions cron has no native "every N days"
# operator (using */5 in day-of-month clusters awkwardly at month boundaries),
# so the cron fires daily and the `cadence` job exits unless day-of-year is
# divisible by 5. The expensive `agent` job only spins up on those days.
# Wobble: one ~6-day gap at the Dec → Jan boundary when DOY resets to 1.

on:
  schedule:
    - cron: '17 8 * * *'      # Daily fire; gated by cadence job below.
  workflow_dispatch: {}        # Manual trigger always runs.

permissions:
  contents: write
  pull-requests: write

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "[cadence] Manual trigger — running."
            exit 0
          fi
          DOY=$(date -u +%j)
          if [ $((10#$DOY % 5)) = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "[cadence] Day-of-year $DOY divisible by 5 — running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "[cadence] Day-of-year $DOY — skipping (every-5-days cadence)."
          fi

  agent:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run database migration (idempotent)
        run: npx tsx scripts/migrate-to-db.ts

      - name: Build run prompt
        run: npx tsx scripts/weekly-agent.ts

      - name: Load system prompt into env
        run: |
          {
            echo "KVANTIQ_SYSTEM_PROMPT<<EOF_KVANTIQ"
            cat scripts/prompts/system-prompt.md
            echo "EOF_KVANTIQ"
          } >> "$GITHUB_ENV"

      # Subscription auth via CLAUDE_CODE_OAUTH_TOKEN. No ANTHROPIC_API_KEY.
      # Generated locally with `claude setup-token`, stored as a repo secret.
      - name: Run Claude Code agent
        uses: anthropics/claude-code-base-action@beta
        timeout-minutes: 45
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: data/weekly-agent-prompt.md
          append_system_prompt: ${{ env.KVANTIQ_SYSTEM_PROMPT }}
          mcp_config: scripts/mcp-config.json
          model: claude-sonnet-4-6
          max_turns: '200'
          allowed_tools: Bash,Read,Write,Edit,Grep,Glob,WebSearch,WebFetch,mcp__kvantiq-tools__send_email,mcp__kvantiq-tools__create_clickup_task
          claude_env: |
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
            CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
            CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `if: always()` on the post-agent steps means a credit/turn failure
      # mid-run doesn't discard partial work that already landed on disk.
      - name: Generate transparency data
        if: always()
        run: npx tsx scripts/generate-transparency-data.ts

      - name: Check for changes
        if: always()
        id: changes
        run: |
          git diff --quiet && git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: always() && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Kvantiq Agent"
          git config user.email "agent@kvantiq.studio"
          BRANCH="agent/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add -A
          git commit -m "chore: agent run $(date +%Y-%m-%d)" || true
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Agent Run — $(date +%Y-%m-%d)" \
            --body "Automated 5-day directory maintenance. Review changes before merging." \
            --base main \
            --head "$BRANCH" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
