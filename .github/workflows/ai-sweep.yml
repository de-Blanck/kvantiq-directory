name: AI Content Sweep

# Runs every 5th calendar day, gated identically to the agent workflow. The
# cron fires daily; the `cadence` job exits early on non-run days.
#
# AI workload runs on the Claude Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN.
# ANTHROPIC_API_KEY must NOT be set — see weekly-agent.yml for full reasoning.

on:
  schedule:
    - cron: '0 0 * * *'      # Daily fire; gated by cadence job below.
  workflow_dispatch:

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "[cadence] Manual trigger — running."
            exit 0
          fi
          DOY=$(date -u +%j)
          if [ $((10#$DOY % 5)) = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "[cadence] Day-of-year $DOY divisible by 5 — running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "[cadence] Day-of-year $DOY — skipping (every-5-days cadence)."
          fi

  sweep:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        # ai-sweep.mjs uses @anthropic-ai/claude-agent-sdk (already a project
        # dep), which shells out to the `claude` CLI. The raw @anthropic-ai/sdk
        # was retired so AI workload runs on the Pro/Max subscription via OAuth.
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AI sweep
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/ai-sweep.mjs

      - name: Validate build
        run: npm run build

      - name: Create PR if changes exist
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'content: AI content sweep'
          title: 'content: AI content sweep'
          body: |
            ## AI Content Sweep

            Automated content freshness check. News items extracted from source URLs only — never fabricated from AI memory.

            **Review checklist:**
            - [ ] News items are factual (spot-check 3-5 entries)
            - [ ] No fabricated funding rounds or partnerships
            - [ ] All news URLs resolve to real pages
            - [ ] Build passes (CI will verify)
          branch: ai-sweep/auto
          labels: ai-sweep
          delete-branch: true
